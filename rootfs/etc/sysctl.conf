# Optimized Kernel sysctl parameters for 32MB SDRAM Cavium STR8132
# Preserve memory for network packet buffers and prevent OOM under heavy Wi-Fi load

# Reserve minimum free Kbytes for atomic allocations (NIC rx/tx ring buffers)
vm.min_free_kbytes = 2048

# Aggressively reclaim directory and inode caches (default is 100, increase to 150)
vm.vfs_cache_pressure = 150

# Keep dirty pages small to avoid sudden large flush stalls
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# Network backlog queue for Fast Ethernet + Dual-Band Wi-Fi
net.core.netdev_max_backlog = 1000

# TCP window and buffer limits suitable for 32MB RAM
net.core.rmem_default = 65536
net.core.wmem_default = 65536
net.core.rmem_max = 262144
net.core.wmem_max = 262144
