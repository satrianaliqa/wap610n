name: Build Firmware (WAP610N)

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target Device Model'
        required: true
        default: 'WAP610N'
        type: choice
        options:
          - WAP610N
          - WET610N

jobs:
  build:
    name: Build & Verify Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build wap610n-builder Container
        run: |
          docker build -t wap610n-builder ./docker

      - name: Compile Firmware in 32-bit Container
        run: |
          TARGET="${{ github.event.inputs.target || 'WAP610N' }}"
          echo "Building target: $TARGET"
          
          docker run --rm \
            --privileged \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            wap610n-builder /bin/bash -c "
              set -e
              echo '--> Step 1: Checking and preparing rootfs...'
              if [ ! -d rootfs-star ]; then
                  tar -zxvf rootfs-star.tgz
              fi
              if [ ! -e rootfs ]; then
                  ln -sf rootfs-star rootfs
              fi

              # Ensure device nodes and init symlinks
              mkdir -p rootfs/dev
              [ -e rootfs/dev/console ] || mknod rootfs/dev/console c 5 1
              [ -e rootfs/dev/null ] || mknod rootfs/dev/null c 1 3
              [ -e rootfs/dev/ttyS0 ] || mknod rootfs/dev/ttyS0 c 4 64
              chmod 600 rootfs/dev/console
              chmod 666 rootfs/dev/null
              chown -R 0:0 rootfs/dev

              # Ensure init symlinks
              ln -sf bin/busybox rootfs/init
              ln -sf ../bin/busybox rootfs/sbin/init
              ln -sf bin/busybox rootfs/linuxrc
              ln -sf busybox rootfs/bin/sh

              echo '--> Step 2: Configuring board target star-6.7.2-mtlk-U-Media-vela...'
              ./make_nv.sh reconf star-6.7.2-mtlk-U-Media-vela

              echo '--> Step 3: Compiling Kernel, Apps, and RootFS...'
              ./make_nv.sh build wlan.tar.gz \$TARGET

              # Copy to clean .bin name
              if [ -e output/bootpImage ]; then
                  cp -vf output/bootpImage output/WAP610N_v1.0.05.bin
              fi

              echo '--> Listing outputs:'
              ls -lh output/
            "

      - name: Audit & Verify Firmware Integrity
        run: |
          ./docker/verify-firmware.sh output/WAP610N_v1.0.05.bin

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WAP610N-Firmware-v1.0.05-${{ github.sha }}
          path: |
            output/WAP610N_v1.0.05.bin
            output/bootpImage
            output/ramdisk_2.6.16.img.lzma
            output/System.map
          if-no-files-found: error
          retention-days: 14
