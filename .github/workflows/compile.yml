name: Build Firmware (WAP610N)

on:
  push:
    branches: [ master, main, testing ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target Device Model'
        required: true
        default: 'WAP610N'
        type: choice
        options:
          - WAP610N

jobs:
  build:
    name: Build & Verify Firmware
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache wap610n-builder Docker Image
        id: cache-builder
        uses: actions/cache@v4
        with:
          path: /tmp/wap610n-builder.tar.gz
          key: wap610n-builder-i386-${{ hashFiles('docker/Dockerfile', 'docker/build-builder.sh') }}

      - name: Load or Build wap610n-builder Container
        run: |
          if [ -f /tmp/wap610n-builder.tar.gz ]; then
            echo "Loading cached wap610n-builder image..."
            docker load -i /tmp/wap610n-builder.tar.gz
          else
            ./docker/build-builder.sh
            docker save wap610n-builder | gzip > /tmp/wap610n-builder.tar.gz
          fi

      - name: Validate Build Prerequisites
        run: ./devscripts/validate-build-prerequisites.sh

      - name: Compile Firmware in 32-bit Container
        run: |
          TARGET="${{ github.event.inputs.target || 'WAP610N' }}"
          echo "Building target: $TARGET"
          mkdir -p output/

          docker run --rm \
            --privileged \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e TARGET="$TARGET" \
            wap610n-builder /bin/bash -c '
              set -e
              export PATH="/workspace/tools/arm-uclibc-3.4.6/bin:$PATH"
              echo "--> Step 1: Preparing clean staging rootfs from rootfs-star..."
              [ -f /workspace/vendor/mtlk/driver/mtlk.ko ] || { echo "❌ ERROR: vendor/mtlk/driver/mtlk.ko not found"; exit 1; }
              [ -d /workspace/rootfs-star ] || { echo "❌ ERROR: rootfs-star not found"; exit 1; }

              rm -rf rootfs
              cp -a rootfs-star rootfs
              ln -sf bin/busybox rootfs/init 2>/dev/null || true
              ln -sf ../bin/busybox rootfs/sbin/init 2>/dev/null || true
              ln -sf bin/busybox rootfs/linuxrc 2>/dev/null || true
              ln -sf busybox rootfs/bin/sh 2>/dev/null || true

              gcc -O2 kernel/linux-2.6.16-star/arch/arm/boot/bootp/mkcsum.c -lz -o kernel/linux-2.6.16-star/arch/arm/boot/bootp/mkcsum
              chmod +x kernel/linux-2.6.16-star/arch/arm/boot/bootp/mkcsum

              which arm-linux-gcc || { echo "❌ ERROR: arm-linux-gcc not in PATH"; exit 1; }
              which arm-linux-uclibc-gcc || { echo "❌ ERROR: arm-linux-uclibc-gcc not in PATH"; exit 1; }

              echo "--> Step 2: Configuring board target star-6.7.2-mtlk-U-Media-vela..."
              ./make_nv.sh reconf star-6.7.2-mtlk-U-Media-vela || { echo "❌ ERROR: make_nv.sh reconf failed"; exit 1; }

              echo "--> Step 3: Compiling Kernel, Apps, and RootFS ($TARGET)..."
              ./make_nv.sh build vendor/mtlk "$TARGET" || { echo "❌ ERROR: make_nv.sh build failed"; exit 1; }

              if [ -e output/bootpImage ] && [ -f config/WAP610N_VERSION ]; then
                  VERSION=$(grep "^FIRMWARE_VERSION=" config/WAP610N_VERSION | head -n 1 | cut -d"\"" -f2 | tr -d "\r\n")
                  BINNAME="WAP610N_v${VERSION}.bin"
                  echo "--> Copying bootpImage → output/$BINNAME (version $VERSION)..."
                  cp -vf output/bootpImage "output/$BINNAME"
              fi

              chmod -R u+rwX,go+rX output/ 2>/dev/null || true
              chmod -R u+rwX,go+rX images/ 2>/dev/null || true
              ls -lh output/
            '

      - name: Audit & Verify Firmware Integrity
        run: |
          if [ ! -f "${{ github.workspace }}/output/bootpImage" ]; then
              echo "❌ ERROR: bootpImage not found in output/"
              ls -lh "${{ github.workspace }}/output/" || true
              exit 1
          fi
          ./docker/verify-firmware.sh
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f output/bootpImage ]; then
            SZ=$(stat -c %s output/bootpImage)
            HEADROOM=$((3801088 - SZ))
            echo "### WAP610N Firmware Build Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "- **bootpImage**: \`${SZ} bytes\` (\`$(awk -v s="$SZ" 'BEGIN{printf "%.2f MB", s/1048576}')\`)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Flash Headroom**: \`${HEADROOM} bytes\` (\`$((HEADROOM / 1024)) KB\` free under 3,801,088 B)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WAP610N-Firmware-${{ github.sha }}
          path: |
            output/WAP610N_v*.bin
            output/ramdisk_2.6.16.img.lzma
            output/System.map
          if-no-files-found: warn
          retention-days: 14
