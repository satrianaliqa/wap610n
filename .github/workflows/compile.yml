name: Build Firmware (WAP610N)

on:
  push:
    branches: [ master, main, testing ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target Device Model'
        required: true
        default: 'WAP610N'
        type: choice
        options:
          - WAP610N
          - WET610N

jobs:
  build:
    name: Build & Verify Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build wap610n-builder Container
        run: |
          docker build -t wap610n-builder ./docker

      - name: Compile Firmware in 32-bit Container
        run: |
          TARGET="${{ github.event.inputs.target || 'WAP610N' }}"
          echo "Building target: $TARGET"
          
          # Validate prerequisites
          echo "Validating prerequisites..."
          [ -f wlan.tar.gz ] || { echo "❌ ERROR: wlan.tar.gz not found"; exit 1; }
          [ -f rootfs-star.tgz ] || { echo "❌ ERROR: rootfs-star.tgz not found"; exit 1; }
          [ -f config/WAP610N_VERSION ] || { echo "❌ ERROR: config/WAP610N_VERSION not found"; exit 1; }
          mkdir -p output/
          
          docker run --rm \
            --privileged \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e TARGET="$TARGET" \
            wap610n-builder /bin/bash -c '
              set -e
              export PATH="/workspace/tools/arm-uclibc-3.4.6/bin:$PATH"
              echo "--> Step 1: Checking and preparing rootfs..."
              echo "--> Validating required archives..."
              [ -f /workspace/wlan.tar.gz ] || { echo "❌ ERROR: wlan.tar.gz not found"; exit 1; }
              [ -f /workspace/rootfs-star.tgz ] || { echo "❌ ERROR: rootfs-star.tgz not found"; exit 1; }
              
              if [ ! -d rootfs-star ]; then
                  tar -zxvf rootfs-star.tgz
              fi
              if [ ! -e rootfs ]; then
                  ln -sf rootfs-star rootfs
              fi

              # Ensure device nodes and init symlinks
              mkdir -p rootfs/dev
              [ -e rootfs/dev/console ] || mknod rootfs/dev/console c 5 1
              [ -e rootfs/dev/null ] || mknod rootfs/dev/null c 1 3
              [ -e rootfs/dev/ttyS0 ] || mknod rootfs/dev/ttyS0 c 4 64
              chmod 600 rootfs/dev/console
              chmod 666 rootfs/dev/null
              chown -R 0:0 rootfs/dev

              # Ensure init symlinks
              ln -sf bin/busybox rootfs/init 2>/dev/null || true
              ln -sf ../bin/busybox rootfs/sbin/init 2>/dev/null || true
              ln -sf bin/busybox rootfs/linuxrc 2>/dev/null || true
              ln -sf busybox rootfs/bin/sh 2>/dev/null || true

              # Ensure host mkcsum tool is compiled
              gcc -O2 kernel/linux-2.6.16-star/arch/arm/boot/bootp/mkcsum.c -lz -o kernel/linux-2.6.16-star/arch/arm/boot/bootp/mkcsum 2>/dev/null || true
              chmod +x kernel/linux-2.6.16-star/arch/arm/boot/bootp/mkcsum 2>/dev/null || true
              
              # Verify toolchain availability
              which arm-linux-gcc || { echo "❌ ERROR: arm-linux-gcc not in PATH"; exit 1; }
              which arm-linux-uclibc-gcc || { echo "❌ ERROR: arm-linux-uclibc-gcc not in PATH"; exit 1; }

              echo "--> Step 2: Configuring board target star-6.7.2-mtlk-U-Media-vela..."
              ./make_nv.sh reconf star-6.7.2-mtlk-U-Media-vela || { echo "❌ ERROR: make_nv.sh reconf failed"; exit 1; }

              echo "--> Step 3: Compiling Kernel, Apps, and RootFS ($TARGET)..."
              ./make_nv.sh build wlan.tar.gz "$TARGET" || { echo "❌ ERROR: make_nv.sh build failed"; exit 1; }

              # Dynamically copy bootpImage with version from config
              if [ -e output/bootpImage ] && [ -f config/WAP610N_VERSION ]; then
                  VERSION=$(grep "FIRMWARE_VERSION" config/WAP610N_VERSION | cut -d"\"" -f2)
                  BINNAME="WAP610N_v${VERSION}.bin"
                  echo "--> Copying bootpImage → output/$BINNAME (version $VERSION)..."
                  cp -vf output/bootpImage "output/$BINNAME"
              fi

              # Fix permissions for runner user
              chmod -R 777 output/ 2>/dev/null || true
              chmod -R 777 images/ 2>/dev/null || true

              echo "--> Listing outputs:"
              ls -lh output/
            '

      - name: Audit & Verify Firmware Integrity
        run: |
          if [ ! -f "${{ github.workspace }}/output/bootpImage" ]; then
              echo "❌ ERROR: bootpImage not found in output/"
              ls -lh "${{ github.workspace }}/output/" || true
              exit 1
          fi
          
          echo "✅ Firmware compiled successfully. Running audit..."
          ./docker/verify-firmware.sh || echo "⚠️  Warning: Audit found non-critical issues"

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WAP610N-Firmware-${{ github.sha }}
          path: |
            output/bootpImage
            output/*WAP610N*
            output/*WET610N*
            output/ramdisk_2.6.16.img.lzma
            output/System.map
          if-no-files-found: warn
          retention-days: 14
